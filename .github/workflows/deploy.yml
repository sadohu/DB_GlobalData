name: CI/CD Pipeline (Deploy Disabled)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.45.x

    - name: Check TypeScript formatting
      run: deno fmt --check

    - name: Run TypeScript checks
      run: deno check supabase/functions/getPersonaNatural/index.ts

